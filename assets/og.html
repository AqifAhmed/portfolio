<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #1C1A16;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    padding: 0 80px;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #EDEAE2;
  }
  .rail {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid #38352F;
    padding-right: 36px;
    font-family: 'Martian Mono', monospace;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .field label { display: block; font-size: 14px; color: #9E9A8B; margin-bottom: 7px; }
  .field span { font-size: 17px; color: #EDEAE2; line-height: 1.35; }
  .field.reading span { color: #DD8A5C; }
  .main { padding-left: 56px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 62px; font-weight: 600; letter-spacing: -0.01em; }
  p.role { font-family: 'Martian Mono', monospace; font-size: 22px; color: #B8B3A6; margin-top: 16px; }
  p.about { font-size: 24px; line-height: 1.5; color: #EDEAE2; margin-top: 26px; max-width: 600px; }
</style>
</head>
<body>
  <div class="rail">
    <div class="field"><label>Subject</label><span>backend &amp; infrastructure engineer</span></div>
    <div class="field"><label>Status</label><span>open to work</span></div>
    <div class="field reading"><label>Reading</label><span>2 shipped</span></div>
  </div>
  <div class="main">
    <h1>Aqif Ahmed</h1>
    <p class="role">backend &amp; infrastructure engineer, lahore</p>
    <p class="about">I measure systems and write down what I find.</p>
  </div>
</body>
</html>
