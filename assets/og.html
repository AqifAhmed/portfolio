<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #E7E4DC;
    overflow: hidden;
  }
  body {
    display: flex;
    padding: 64px;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #1B1B18;
  }
  .rail {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid #C9C4B6;
    padding-right: 32px;
    font-family: 'Martian Mono', monospace;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .field label { display: block; font-size: 13px; color: #7A766A; margin-bottom: 6px; }
  .field span { font-size: 15px; color: #1B1B18; }
  .field.reading span { color: #A6531C; }
  .main { padding-left: 48px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 56px; font-weight: 600; letter-spacing: -0.01em; }
  p.role { font-family: 'Martian Mono', monospace; font-size: 20px; color: #4A473E; margin-top: 14px; }
  p.about { font-size: 22px; line-height: 1.5; color: #1B1B18; margin-top: 24px; max-width: 620px; }
</style>
</head>
<body>
  <div class="rail">
    <div class="field"><label>Subject</label><span>backend &amp; infrastructure engineer</span></div>
    <div class="field"><label>Status</label><span>open to work</span></div>
    <div class="field reading"><label>Reading</label><span>2 shipped</span></div>
  </div>
  <div class="main">
    <h1>Aqif Ahmed</h1>
    <p class="role">backend &amp; infrastructure engineer, lahore</p>
    <p class="about">I measure systems and write down what I find.</p>
  </div>
</body>
</html>
